<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Outsider" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#FF5A00" />
    <meta name="description" content="Outsider gets you out of the house: places, events and people near you, plus rewards for going out." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Outsider | Go out more</title>
    <script>
      try {
        var t = localStorage.getItem("outsider-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div style="font-family:system-ui,sans-serif">
      <div style="height:64px;display:flex;align-items:center;gap:6px;padding:0 16px;border-bottom:1px solid #e3e0dc"><svg width="28" height="28" viewBox="0 0 32 32"><path d="M16 3a8.5 8.5 0 0 0-8.5 8.5C7.5 18 16 29 16 29s8.5-11 8.5-17.5A8.5 8.5 0 0 0 16 3Z" fill="#FF5A00"/><circle cx="16" cy="11.5" r="3.2" fill="#fff"/></svg><b style="font-size:24px;color:#242326">Outsider</b></div>
      <div class="sk-wrap"><div class="sk" style="height:72px;border-radius:999px;width:72px;display:inline-block;margin-right:12px"></div><div class="sk" style="height:72px;border-radius:999px;width:72px;display:inline-block;margin-right:12px"></div><div class="sk" style="height:72px;border-radius:999px;width:72px;display:inline-block"></div>
      <div class="sk" style="height:42px;border-radius:999px;margin:18px 0"></div><div class="sk" style="height:14px;width:40%;margin-bottom:10px"></div><div class="sk" style="aspect-ratio:4/5;border-radius:16px"></div></div>
    </div></div>
    <style>.sk-wrap{max-width:576px;margin:0 auto;padding:16px}.sk{background:#ebe9e6;border-radius:10px;animation:skp 1.4s ease-in-out infinite}@keyframes skp{50%{opacity:.5}}@media (prefers-color-scheme:dark){.sk{background:#3b3b40}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
